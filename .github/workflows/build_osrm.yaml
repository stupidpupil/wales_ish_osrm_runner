on: 
  workflow_dispatch:

name: build_osrm_and_prepare_graph

jobs:
  build_osrm_and_prepare_graph:
    runs-on: macOS-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v2

      - uses: r-lib/actions/setup-r@v2
        if: steps.cache_osm.outputs.cache-hit != 'true'

      - name: Query dependencies
        run: |
          install.packages('remotes')
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
          writeLines(sprintf("R-%i.%i", getRversion()$major, getRversion()$minor), ".github/R-version")
        shell: Rscript {0}

      - name: Restore R package cache
        uses: actions/cache@v2
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-

      - name: Install dependencies
        run: |
          install.packages(c("devtools"))
          devtools::install_deps(dependencies = TRUE, type="binary")
        shell: Rscript {0}

      - uses: actions/checkout@v4
        with:
          repository: 'Project-OSRM/osrm-backend'
          path: 'osrm-backend'
          ref: '4f3ee609ec1af40eb1f445c6706cfa5beb04c990'

      - name: Get osrm-backend ref
        id: osrm-backend-ref
        run: |
          echo "ref=$(git -C osrm-backend rev-parse HEAD)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache osrm-backend/build
        id: cache_osrm_backend_build
        uses: actions/cache@v4
        with:
          path: |
            osrm-backend/build
            osrm-backend/mason_packages
          key: ${{ runner.os }}-${{ steps.osrm-backend-ref.outputs.ref }}-osrm-v2
          
      - name: Build osrm-backend
        if: steps.cache_osrm_backend_build.outputs.cache-hit != 'true'
        run: |
          cd osrm-backend
          rm -rf build
          mkdir build
          cd build
          cmake ../ -DENABLE_MASON=1
          make
          cd ../../
        shell: bash

      - name: Clean osrm-backend
        run: |
          rm -rf osrm-backend/build/CMakeFiles
          rm -rf osrm-backend/build/libosrm*
          rm -rf osrm-backend/build/flatbuffers-build
          rm -rf osrm-backend/mason_packages/headers/
          rm -rf osrm-backend/mason_packages/.binaries/
          rm -rf osrm-backend/third_party/
          rm -rf osrm-backend/unit_tests/
          rm -rf osrm-backend/src/
          rm -rf osrm-backend/docs/
          rm -rf osrm-backend/features/
          rm -rf osrm-backend/include/
          rm -rf osrm-backend/test/
          rm -rf osrm-backend/.git
          rm -rf osrm-backend/.github
          find osrm-backend -name "*.c" -type f -delete
          find osrm-backend -name "*.cc" -type f -delete
          find osrm-backend -name "*.h" -type f -delete
          find osrm-backend -name "*.cpp" -type f -delete
          find osrm-backend -name "*.hpp" -type f -delete
          find osrm-backend -name "*.py" -type f -delete
          find osrm-backend -name "*.md" -type f -delete
          find osrm-backend -name "*.rst" -type f -delete
          find osrm-backend -name "*.txt" -type f -delete
          find osrm-backend -name "*.pbf" -type f -delete
          find osrm-backend -name "*.rs" -type f -delete
          find osrm-backend -name "*.png" -type f -delete
          find osrm-backend -name "*.jpg" -type f -delete
        shell: bash

      - name: Fetch OSRM graph
        run: |
          devtools::load_all()
          fetch_osrm_graph()
        shell: Rscript {0}

      - name: Download trip points
        run: |
          curl https://raw.githubusercontent.com/stupidpupil/wales_lsoa_trip_points/points-releases/lsoa11_nearest_road_points.geojson -o data/lsoa11_nearest_road_points.geojson

      - name: Produce coords.txt
        run: |
          devtools::load_all()
          produce_coords()
        shell: Rscript {0}

      - name: Cache output.json
        id: cache_output_json
        uses: actions/cache@v2
        with:
          path: |
            data/output.json
          key: ${{ steps.osrm-backend-ref.outputs.ref }}-${{ hashFiles('data-raw/osrm_driving/*.osrm*') }}-${{ hashFiles('data/coords.txt') }}-v2

      - name: Run OSRM and issue query
        if: steps.cache_output_json.outputs.cache-hit != 'true'
        run: |
          osrm-backend/build/osrm-routed --max-table-size=3000 --algorithm ch data-raw/osrm_driving/walesish.osrm &
          sleep 60
          COORDS=$(cat data/coords.txt)
          OSRM_URL="http://127.0.0.1:5000/table/v1/driving/$COORDS"
          curl $OSRM_URL -o "data/output.json"
        shell: bash

      - name: Upload output artifact
        uses: actions/upload-artifact@v2
        with:
          name: output.json
          path: data/output.json
          if-no-files-found: error

      - name: Produce travel-time matrix
        run: |
          devtools::load_all()
          write_osrm_matrix()
        shell: Rscript {0}

      - name: Upload matrix artifact
        uses: actions/upload-artifact@v2
        with:
          name: matrix.csv
          path: output/arrive_by_0900_driving.csv
          if-no-files-found: error

      - name: Checkout matrix-releases branch
        uses: actions/checkout@v2
        with:
          ref: matrix-releases
          path: matrix-releases

      - name: Copy matrices and commit
        run: |
          cd matrix-releases
          rm -f *.csv
          rm -f index.json
          cp ../output/*.csv .
          cp ../output/index.json .
          git config user.name "Graph Release Bot"
          git config user.email "<>"
          git add .
          git commit -m "Updated for new release"
          git push origin matrix-releases
          cd ..

